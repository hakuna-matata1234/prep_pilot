<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer glowing ring -->
  <circle cx="100" cy="100" r="88" stroke="url(#primaryGrad)" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="8 6"/>
  
  <!-- Pilot Wings left & right -->
  <path d="M30 105 C50 85, 75 90, 90 102 C75 110, 50 114, 30 105 Z" fill="url(#primaryGrad)" opacity="0.9"/>
  <path d="M170 105 C150 85, 125 90, 110 102 C125 110, 150 114, 170 105 Z" fill="url(#primaryGrad)" opacity="0.9"/>
  
  <!-- Center Core Orb -->
  <circle cx="100" cy="100" r="32" fill="url(#primaryGrad)" filter="url(#glow)"/>
  
  <!-- Soundwave / Mic graphic -->
  <rect x="88" y="88" width="5" height="24" rx="2.5" fill="#FFFFFF"/>
  <rect x="97.5" y="80" width="5" height="40" rx="2.5" fill="url(#amberGrad)"/>
  <rect x="107" y="88" width="5" height="24" rx="2.5" fill="#FFFFFF"/>

  <!-- Orbiting sparkle -->
  <circle cx="145" cy="55" r="5" fill="#FBBF24" filter="url(#glow)"/>
</svg>
